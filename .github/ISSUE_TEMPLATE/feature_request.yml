name: Feature request
description: Propose an animation, provider, board, or daemon improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like ToknMon to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why, and any sketch or reference
      description: Screenshots, text-grid art, or links are welcome.
